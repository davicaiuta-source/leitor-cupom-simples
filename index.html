<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Leitor de Cupom Fiscal</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #0f766e;
    --primary-dark: #115e59;
    --border: #e5e7eb;
    --danger: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --card: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.25rem; }
  header p { margin: 4px 0 0; font-size: .85rem; opacity: .85; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  #reader { width: 100%; border-radius: 8px; overflow: hidden; }
  #reader video { border-radius: 8px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button {
    flex: 1 1 140px;
    min-height: 48px;
    border: 0;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--primary);
    color: #fff;
  }
  button:active { background: var(--primary-dark); }
  button.secondary { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
  button:disabled { opacity: .5; cursor: default; }
  details summary { cursor: pointer; color: var(--muted); font-size: .9rem; margin-top: 12px; }
  .manual { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .manual input {
    flex: 1 1 200px;
    min-height: 44px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    background: var(--bg);
    color: var(--text);
  }
  #status { font-size: .9rem; color: var(--muted); margin: 0 0 12px; word-break: break-all; }
  #status.error { color: var(--danger); }
  .spinner {
    display: inline-block; width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px;
    border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .store { font-weight: 700; margin: 0 0 4px; }
  .store-info { color: var(--muted); font-size: .85rem; margin: 0 0 12px; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  ul.items li:last-child { border-bottom: 0; }
  .item-name { font-weight: 600; word-break: break-word; }
  .item-meta { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .item-total { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .summary {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 2px solid var(--text); margin-top: 8px; padding-top: 12px;
    font-size: 1.15rem; font-weight: 700;
  }
  .summary small { font-weight: 400; color: var(--muted); font-size: .85rem; display: block; }
  a { color: var(--primary); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Leitor de Cupom Fiscal</h1>
  <p>Escaneie o QR Code da NFC-e para ver os produtos</p>
</header>

<main>
  <section class="card" id="scanCard">
    <div id="reader"></div>
    <div class="btns">
      <button id="btnStart">📷 Escanear QR Code</button>
      <button id="btnStop" class="secondary hidden">Parar câmera</button>
    </div>
    <details>
      <summary>Colar URL manualmente</summary>
      <div class="manual">
        <input id="manualUrl" type="url" placeholder="https://...sefaz...">
        <button id="btnManual" class="secondary">Buscar</button>
      </div>
    </details>
  </section>

  <section class="card hidden" id="resultCard">
    <p id="status"></p>
    <div id="result"></div>
  </section>
</main>

<script>
  // Proxies CORS tentados em ordem; se um falhar, passa para o próximo
  const PROXIES = [
    { name: 'allorigins', build: (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) },
    { name: 'allorigins (json)', build: (u) => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u), json: true },
    { name: 'codetabs', build: (u) => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u) },
    { name: 'corsproxy.io', build: (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u) }
  ];
  const TIMEOUT_MS = 15000;

  const $ = (id) => document.getElementById(id);
  const btnStart = $('btnStart');
  const btnStop = $('btnStop');
  const resultCard = $('resultCard');
  const statusEl = $('status');
  const resultEl = $('result');

  let scanner = null;
  let busy = false;

  // ---------- Helpers ----------
  const brl = (n) => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

  function toNumber(str) {
    if (!str) return NaN;
    const m = String(str).replace(/\s/g, '').match(/-?[\d.]*,?\d+/);
    if (!m) return NaN;
    return parseFloat(m[0].replace(/\./g, '').replace(',', '.'));
  }

  function clean(str) {
    return (str || '').replace(/\s+/g, ' ').trim();
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function setStatus(msg, { loading = false, error = false } = {}) {
    resultCard.classList.remove('hidden');
    statusEl.className = error ? 'error' : '';
    statusEl.innerHTML = (loading ? '<span class="spinner"></span>' : '') + msg;
  }

  // ---------- Câmera ----------
  async function startScanner() {
    if (!scanner) scanner = new Html5Qrcode('reader');
    btnStart.disabled = true;
    try {
      await scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.75); return { width: s, height: s }; } },
        onScanSuccess,
        () => {}
      );
      btnStart.classList.add('hidden');
      btnStop.classList.remove('hidden');
    } catch (err) {
      setStatus('Não foi possível abrir a câmera: ' + escapeHtml(err?.message || err) +
        '<br>Obs.: a câmera só funciona em HTTPS ou localhost.', { error: true });
    } finally {
      btnStart.disabled = false;
    }
  }

  async function stopScanner() {
    if (scanner && scanner.isScanning) {
      try { await scanner.stop(); } catch (_) {}
    }
    btnStop.classList.add('hidden');
    btnStart.classList.remove('hidden');
  }

  async function onScanSuccess(text) {
    if (busy) return;
    busy = true;
    if (navigator.vibrate) navigator.vibrate(100);
    await stopScanner();
    await processUrl(text.trim());
    busy = false;
  }

  // ---------- Busca + parse ----------
  async function fetchWithTimeout(url) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      return await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    } finally {
      clearTimeout(timer);
    }
  }

  async function fetchViaProxies(url) {
    const errors = [];
    for (let i = 0; i < PROXIES.length; i++) {
      const p = PROXIES[i];
      setStatus('Buscando nota na SEFAZ... (' + (i + 1) + '/' + PROXIES.length + ': ' + p.name + ')', { loading: true });
      try {
        const res = await fetchWithTimeout(p.build(url));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const html = p.json ? (await res.json()).contents : await res.text();
        if (!html || html.length < 200) throw new Error('resposta vazia');
        return html;
      } catch (err) {
        errors.push(p.name + ': ' + (err.name === 'AbortError' ? 'tempo esgotado' : err.message));
      }
    }
    throw new Error('Nenhum proxy respondeu.<br><small>' + errors.map(escapeHtml).join('<br>') + '</small>');
  }

  async function processUrl(url) {
    resultEl.innerHTML = '';
    if (!/^https?:\/\//i.test(url)) {
      setStatus('O QR Code lido não contém uma URL válida:<br><code>' + escapeHtml(url) + '</code>', { error: true });
      return;
    }
    try {
      const html = await fetchViaProxies(url);
      const data = parseNota(html);

      if (!data.items.length) {
        setStatus('Não encontrei produtos na resposta da SEFAZ. O layout desse estado pode ser diferente ou a consulta pode exigir captcha. ' +
          '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">Abrir nota original</a>', { error: true });
        return;
      }
      setStatus('<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">Ver nota original na SEFAZ</a>');
      renderNota(data);
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      setStatus('Erro ao buscar a nota: ' + err.message +
        '<br><button class="secondary" id="btnRetry" style="margin:8px 0">Tentar novamente</button><br>' +
        '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">Abrir nota original</a>', { error: true });
      $('btnRetry').addEventListener('click', () => processUrl(url));
    }
  }

  function parseNota(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const text = (sel, root = doc) => clean(root.querySelector(sel)?.textContent);

    const data = {
      store: text('#u20') || text('.txtTopo'),
      storeInfo: Array.from(doc.querySelectorAll('#conteudo > .txtCenter .text')).map(e => clean(e.textContent)).join(' · '),
      items: [],
      total: NaN
    };

    // Layout padrão nacional da NFC-e (SP, BA, PR, RS, GO, etc.)
    let rows = doc.querySelectorAll('#tabResult tr');
    if (!rows.length) rows = Array.from(doc.querySelectorAll('tr')).filter(tr => tr.querySelector('.txtTit'));

    rows.forEach(tr => {
      const name = text('.txtTit', tr) || text('.txtTit2', tr);
      if (!name) return;
      const qtd = toNumber(text('.Rqtd', tr).replace(/qtde\.?:?/i, ''));
      const un = clean(text('.RUN', tr).replace(/un:?/i, ''));
      const unit = toNumber(text('.RvlUnit', tr).replace(/vl\.?\s*unit\.?:?/i, ''));
      let total = toNumber(text('.valor', tr));
      if (isNaN(total) && !isNaN(qtd) && !isNaN(unit)) total = qtd * unit;
      data.items.push({ name, qtd, un, unit, total });
    });

    // Fallback genérico: tabelas com colunas descrição/qtd/valor
    if (!data.items.length) {
      doc.querySelectorAll('table tr').forEach(tr => {
        const cells = Array.from(tr.querySelectorAll('td')).map(td => clean(td.textContent));
        if (cells.length < 3) return;
        const nums = cells.map(toNumber);
        const name = cells.find((c, i) => isNaN(nums[i]) && c.length > 2);
        const numeric = nums.filter(n => !isNaN(n));
        if (!name || numeric.length < 2) return;
        data.items.push({ name, qtd: numeric[0], un: '', unit: NaN, total: numeric[numeric.length - 1] });
      });
    }

    // Total da nota
    const totalEl = Array.from(doc.querySelectorAll('#totalNota #linhaTotal')).find(l => /valor a pagar/i.test(l.textContent))
      || doc.querySelector('#totalNota .totalNumb.txtMax');
    data.total = toNumber(totalEl ? (totalEl.querySelector('.totalNumb')?.textContent || totalEl.textContent) : '');
    if (isNaN(data.total)) data.total = data.items.reduce((s, i) => s + (isNaN(i.total) ? 0 : i.total), 0);

    return data;
  }

  function renderNota(data) {
    const fmtQtd = (q) => isNaN(q) ? '' : q.toLocaleString('pt-BR', { maximumFractionDigits: 3 });
    const sumItems = data.items.reduce((s, i) => s + (isNaN(i.total) ? 0 : i.total), 0);

    let html = '';
    if (data.store) html += '<p class="store">' + escapeHtml(data.store) + '</p>';
    if (data.storeInfo) html += '<p class="store-info">' + escapeHtml(data.storeInfo) + '</p>';

    html += '<ul class="items">';
    data.items.forEach(i => {
      const meta = [
        !isNaN(i.qtd) ? fmtQtd(i.qtd) + (i.un ? ' ' + escapeHtml(i.un) : '') : '',
        !isNaN(i.unit) ? '× ' + brl(i.unit) : ''
      ].filter(Boolean).join(' ');
      html += '<li><div><div class="item-name">' + escapeHtml(i.name) + '</div>' +
        (meta ? '<div class="item-meta">' + meta + '</div>' : '') + '</div>' +
        '<div class="item-total">' + (isNaN(i.total) ? '—' : brl(i.total)) + '</div></li>';
    });
    html += '</ul>';

    html += '<div class="summary"><div>Total<small>' + data.items.length + ' ' +
      (data.items.length === 1 ? 'item' : 'itens') +
      (Math.abs(sumItems - data.total) > 0.009 ? ' · soma dos itens ' + brl(sumItems) : '') +
      '</small></div><div>' + brl(data.total) + '</div></div>';

    resultEl.innerHTML = html;
  }

  // ---------- Eventos ----------
  btnStart.addEventListener('click', startScanner);
  btnStop.addEventListener('click', stopScanner);
  $('btnManual').addEventListener('click', () => {
    const url = $('manualUrl').value.trim();
    if (url) processUrl(url);
  });
  $('manualUrl').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('btnManual').click();
  });
</script>
</body>
</html>
