<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4a">
<title>Leitor de Cupom Fiscal - PR</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f0f4f3;--card:#fff;--text:#1a2a26;--green:#0f5c4a;--border:#e2e8e6;--red:#b42318}
*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:var(--bg);color:var(--text)}
header{background:var(--green);color:#fff;padding:20px 16px;text-align:center}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px rgba(0,0,0,.06);border:1px solid var(--border)}
.btn{width:100%;background:var(--green);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
.btn-sec{background:#fff;color:var(--green);border:2px solid var(--green)}
#reader{width:100%;border-radius:12px;overflow:hidden;margin-top:12px}
input{width:100%;padding:12px;border:1px solid #d0d8d5;border-radius:10px;margin-top:8px}
.prod{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--border)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding-top:12px;margin-top:8px;border-top:2px solid var(--text)}
.err{color:var(--red);background:#fef0ef;padding:12px;border-radius:10px;font-size:13px;line-height:1.5;word-break:break-word}
</style>
</head>
<body>
<header><h1>Leitor de Cupom Fiscal</h1><p style="margin:6px 0 0;opacity:.9;font-size:14px">Escaneie o QR Code da NFC-e</p></header>
<div class="wrap">
<div class="card">
<button class="btn" id="btnScan">📷 Escanear QR Code</button>
<div id="reader" style="display:none"></div>
<details style="margin-top:12px"><summary style="cursor:pointer;color:#0f5c4a;font-weight:700">▶ Colar URL manualmente</summary>
<input id="urlInput" placeholder="https://www.fazenda.pr.gov.br/nfce/qrcode...">
<button class="btn btn-sec" style="margin-top:8px" id="btnManual">Buscar nota</button>
</details>
</div>
<div class="card" id="result" style="display:none"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const resultEl=$('#result');
function show(html){resultEl.style.display='block';resultEl.innerHTML=html; window.scrollTo({top:resultEl.offsetTop-20,behavior:'smooth'});}
let lastUrl='';
async function fetchViaProxy(target){
  const proxies=[
    url=>`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url=>`https://corsproxy.io/?${encodeURIComponent(url)}`,
    url=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    url=>`https://thingproxy.freeboard.io/fetch/${url}`,
    url=>`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`
  ];
  let erros=[];
  for(let i=0;i<proxies.length;i++){
    const pUrl=proxies[i](target);
    try{
      show(`<div>🔍 Buscando na SEFAZ... tentativa ${i+1}/${proxies.length}<br><small>${target}</small></div>`);
      const ctrl=new AbortController();
      const to=setTimeout(()=>ctrl.abort(),12000);
      const res=await fetch(pUrl,{signal:ctrl.signal});
      clearTimeout(to);
      if(!res.ok) throw new Error('HTTP '+res.status);
      let txt='';
      if(pUrl.includes('/get?')){
        const j=await res.json();
        txt=j.contents||'';
      }else txt=await res.text();
      if(!txt || txt.length<300) throw new Error('resposta vazia');
      return txt;
    }catch(e){erros.push(`proxy${i}: ${e.message}`);}
  }
  throw new Error(erros.join(' | '));
}
function parseNota(htmlText){
  const doc=new DOMParser().parseFromString(htmlText,'text/html');
  const getText=s=>{ const el=doc.querySelector(s); return el?el.innerText.trim():''; };
  let produtos=[];
  doc.querySelectorAll('#tabResult tr').forEach(tr=>{
    const nomeSpan=tr.querySelector('.txtTit');
    if(!nomeSpan) return;
    const nome=nomeSpan.innerText.trim();
    if(!nome || nome.toLowerCase().includes('descri')) return;
    const qtd=tr.querySelector('.Rqtd')?.innerText|| tr.querySelectorAll('td')[1]?.innerText||'1';
    const un=tr.querySelector('.RUN')?.innerText?.replace(/UN:?/i,'').trim()||'';
    const vlTotal=tr.querySelector('.valor')?.innerText||'';
    produtos.push({nome,qtd,un,valor:vlTotal});
  });
  if(produtos.length===0){
    doc.querySelectorAll('tr').forEach(tr=>{
      const tds=tr.querySelectorAll('td');
      if(tds.length>=4){
        const nome=tds[0]?.innerText?.trim();
        if(!nome||nome.length<3||nome.length>120) return;
        if(nome.toLowerCase().includes('descri')) return;
        produtos.push({nome,qtd:tds[1].innerText.trim(),un:tds[2].innerText.trim(),valor:tds[3].innerText.trim()});
      }
    });
  }
  let total='';
  const totalEl=doc.querySelector('#totalNota .totalNumb.txtMax')||doc.querySelector('#linhaTotal .totalNumb');
  if(totalEl) total=totalEl.innerText.trim();
  else{
    const m=(doc.body.innerText||'').match(/Valor a pagar[^\d]*R\$\s*([\d.,]+)/i);
    if(m) total=m[1];
  }
  const loja=getText('#u20')||getText('.txtTopo')||'';
  return {produtos,total,loja};
}
async function buscarNota(url){
  lastUrl=url;
  show(`<div>🔍 Buscando nota na SEFAZ PR...<br><small style="color:#666">${url}</small></div>`);
  try{
    const html=await fetchViaProxy(url);
    const dados=parseNota(html);
    if(dados.produtos.length===0){
      show(`<div class=err>Consegui acessar mas nao achei produtos.<br><br><a href="${url}" target=_blank>Abrir nota original</a><br><br><button class="btn btn-sec" onclick="buscarNota(lastUrl)">Tentar novamente</button></div>`);
      return;
    }
    let h='';
    if(dados.loja) h+=`<div style="font-weight:800;margin-bottom:12px">${dados.loja}</div>`;
    dados.produtos.forEach(p=>{
      h+=`<div class=prod><div style="flex:1;padding-right:10px"><b>${p.nome}</b><br><small>${p.qtd} ${p.un}</small></div><div><b>${p.valor?('R$ '+p.valor):''}</b></div></div>`;
    });
    if(dados.total) h+=`<div class=total><span>Total</span><span>R$ ${dados.total}</span></div>`;
    h+=`<div style="margin-top:16px"><a href="${url}" target=_blank style="color:#0f5c4a;font-weight:700">Abrir nota original</a></div>`;
    show(h);
  }catch(e){
    show(`<div class=err><b>Erro ao buscar a nota:</b><br>${e.message}<br><br>Clique em Tentar novamente, na 2a vez geralmente vai.<br><br><button class="btn btn-sec" onclick="buscarNota(lastUrl)">Tentar novamente</button><br><br><a href="${url}" target=_blank style="color:#0f5c4a;font-weight:700">Abrir nota original</a></div>`);
  }
}
$('#btnManual').onclick=()=>{const u=$('#urlInput').value.trim(); if(!u){alert('Cole a URL');return;} buscarNota(u);};
let qr=null;
$('#btnScan').onclick=async()=>{
  const rEl=$('#reader'); rEl.style.display='block';
  if(qr){try{await qr.stop();}catch{}}
  qr=new Html5Qrcode("reader");
  try{
    await qr.start({facingMode:"environment"},{fps:10,qrbox:250},(decoded)=>{qr.stop(); rEl.style.display='none'; $('#urlInput').value=decoded; buscarNota(decoded);},()=>{});
    $('#btnScan').textContent='Parar camera';
  }catch(err){alert('Erro na camera: '+err.message);}
};
window.buscarNota=buscarNota;
</script>
</body>
</html>
