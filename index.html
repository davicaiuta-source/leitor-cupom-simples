<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor de Cupom - Estoque</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:15px;background:#f5f5f5}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1);margin-bottom:15px}
button{width:100%;padding:12px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-blue{background:#1976d2;color:white}
.btn-green{background:#2e7d32;color:white}
.btn-orange{background:#ef6c00;color:white}
.btn-gray{background:#757575;color:white}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin-top:8px;box-sizing:border-box}
#reader{width:100%;border-radius:12px;overflow:hidden}
.hidden{display:none}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;color:white}
.badge-ind{background:#1976d2}
.badge-col{background:#ef6c00}
</style>
</head>
<body>

<div id="tela-login" class="card">
<h2>🔐 Entrar</h2>
<p style="font-size:14px;color:#666">Cadastro Individual e Coletivo ativado</p>
<input id="email" type="email" placeholder="Seu e-mail">
<input id="senha" type="password" placeholder="Sua senha">
<button class="btn-blue" onclick="fazerLogin()">Entrar / Criar Conta</button>
<p id="msg-login" style="font-size:13px;color:#d32f2f"></p>
</div>

<div id="tela-app" class="hidden">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<span id="user-info" style="font-weight:bold"></span>
<button onclick="sair()" style="width:auto;padding:6px 12px;background:#eee;color:#333">Sair</button>
</div>
</div>

<div class="card">
<h3>📷 Leitor de Cupom</h3>
<div id="reader"></div>
<button class="btn-gray" onclick="iniciarScanner()">Iniciar Câmera</button>
<button class="btn-gray" onclick="pararScanner()">Parar Câmera</button>
<input id="codigo-manual" placeholder="Código do cupom / nota" style="margin-top:15px">
<button class="btn-blue" onclick="processarCodigo(document.getElementById('codigo-manual').value)">Processar Código</button>
</div>

<div id="tela-produto" class="card hidden">
<h3>✅ Cupom Lido</h3>
<p id="codigo-lido" style="word-break:break-all;background:#f0f0f0;padding:10px;border-radius:8px"></p>
<label>Tipo de Cadastro:</label>
<select id="tipo-cadastro" onchange="alternarTipo()">
<option value="individual">Individual - só meu</option>
<option value="coletivo">Coletivo - grupo / família</option>
</select>
<div id="campo-grupo" class="hidden">
<input id="nome-grupo" placeholder="Nome do grupo ex: familia-silva">
</div>
<input id="nome-produto" placeholder="Nome do produto">
<input id="qtd-produto" type="number" value="1">
<button class="btn-green" onclick="salvarEstoque()">💾 Salvar no Estoque</button>
<p id="msg-salvar" style="font-size:13px"></p>
</div>

<div class="card">
<h3>📦 Meu Estoque</h3>
<div style="display:flex;gap:8px">
<button class="btn-blue" style="flex:1" onclick="carregarEstoque('individual')">Ver Individual</button>
<button class="btn-orange" style="flex:1" onclick="carregarEstoque('coletivo')">Ver Coletivo</button>
</div>
<div id="lista-estoque" style="margin-top:15px"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getDatabase, ref, push, get, child } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYIkBLBlP4QSfkC3VluXRzUlcbz_phepY",
  authDomain: "cupons-77a31.firebaseapp.com",
  projectId: "cupons-77a31",
  storageBucket: "cupons-77a31.firebasestorage.app",
  messagingSenderId: "558288714197",
  appId: "1:558288714197:web:e64c0f8af27d96861fe55c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let html5QrCode = null;
let codigoAtual = "";

window.fazerLogin = async function(){
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value.trim();
  const msg = document.getElementById('msg-login');
  if(!email || !senha){ msg.innerText="Preencha e-mail e senha"; return; }
  try{ await signInWithEmailAndPassword(auth, email, senha); }
  catch(e){
    try{ await createUserWithEmailAndPassword(auth, email, senha); msg.style.color="green"; msg.innerText="Conta criada!"; }
    catch(e2){ msg.innerText="Erro: "+e2.message; }
  }
}
window.sair = function(){ signOut(auth); }
onAuthStateChanged(auth, (user)=>{
  if(user){
    document.getElementById('tela-login').classList.add('hidden');
    document.getElementById('tela-app').classList.remove('hidden');
    document.getElementById('user-info').innerText = "👤 "+user.email;
  }else{
    document.getElementById('tela-login').classList.remove('hidden');
    document.getElementById('tela-app').classList.add('hidden');
  }
});
window.iniciarScanner = function(){
  if(html5QrCode) return;
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start({facingMode:"environment"}, {fps:10, qrbox:{width:250,height:250}},
    (decoded)=>{ processarCodigo(decoded); pararScanner(); }, (err)=>{}
  ).catch(e=>alert("Erro câmera: "+e));
}
window.pararScanner = function(){ if(html5QrCode){ html5QrCode.stop().then(()=>{ html5QrCode=null; }); } }
window.processarCodigo = function(codigo){
  if(!codigo) return;
  codigoAtual = codigo;
  document.getElementById('codigo-lido').innerText = codigo;
  document.getElementById('tela-produto').classList.remove('hidden');
}
window.alternarTipo = function(){
  const tipo = document.getElementById('tipo-cadastro').value;
  document.getElementById('campo-grupo').classList.toggle('hidden', tipo!=='coletivo');
}
window.salvarEstoque = async function(){
  const user = auth.currentUser;
  if(!user){ alert("Faça login primeiro"); return; }
  const tipo = document.getElementById('tipo-cadastro').value;
  const nomeGrupo = document.getElementById('nome-grupo').value.trim().toLowerCase().replace(/\s+/g,'-');
  const nomeProd = document.getElementById('nome-produto').value.trim() || "Produto";
  const qtd = parseInt(document.getElementById('qtd-produto').value) || 1;
  const msg = document.getElementById('msg-salvar');
  if(tipo==='coletivo' && !nomeGrupo){ msg.innerText="Digite o nome do grupo"; return; }
  try{
    const dados = { codigo: codigoAtual, produto: nomeProd, quantidade: qtd, criadoPor: user.email, uid: user.uid, data: new Date().toISOString(), tipo: tipo };
    let caminho;
    if(tipo==='individual'){ caminho = ref(db, 'users/'+user.uid+'/estoque'); }
    else{ caminho = ref(db, 'groups/'+nomeGrupo+'/estoque'); }
    await push(caminho, dados);
    msg.style.color="green";
    msg.innerText = tipo==='individual' ? "✅ Salvo individual!" : "✅ Salvo no grupo "+nomeGrupo+"!";
  }catch(e){ msg.style.color="red"; msg.innerText="Erro: "+e.message; }
}
window.carregarEstoque = async function(tipo, nomeGrupoParam=null){
  const user = auth.currentUser;
  const lista = document.getElementById('lista-estoque');
  lista.innerHTML="Carregando...";
  try{
    let caminhoStr;
    if(tipo==='individual'){ caminhoStr = 'users/'+user.uid+'/estoque'; }
    else{
      let nomeGrupo = nomeGrupoParam || document.getElementById('nome-grupo').value.trim().toLowerCase().replace(/\s+/g,'-');
      if(!nomeGrupo){ lista.innerHTML="Digite o nome do grupo"; return; }
      caminhoStr = 'groups/'+nomeGrupo+'/estoque';
    }
    const snap = await get(child(ref(db), caminhoStr));
    if(!snap.exists()){ lista.innerHTML="Nenhum item"; return; }
    let html="";
    snap.forEach(childSnap=>{
      const v = childSnap.val();
      html+=`<div style="border-bottom:1px solid #eee;padding:10px 0"><b>${v.produto}</b> - Qtd: ${v.quantidade}<br><small>${v.codigo.substring(0,40)}... por ${v.criadoPor}</small></div>`;
    });
    lista.innerHTML=html;
  }catch(e){ lista.innerHTML="Erro: "+e.message; }
}
</script>
</body>
</html>
